name: Remote engine tests

# Runs remote_engine_test/ (lib/services/remote_game_engine.dart exercised
# directly against a dockerized CRG scoreboard server, no app UI/emulator
# involved) as a matrix across every supported scoreboard version, and
# publishes each version's results as a separate GitHub Check via
# dorny/test-reporter.
#
# Manual-only via workflow_dispatch for now.
#
# TEMPORARY: `push` is enabled below only so this workflow can be exercised
# on this branch before it's merged - workflow_dispatch can't target a
# workflow that doesn't exist on the default branch yet. Remove the `push`
# trigger before merging to main. Before merging, this should also run on
# every PR to main and be a required check (note: branch protection's
# required-status-checks needs each matrix job's check name listed
# individually, or a small aggregator job that depends on the whole matrix).
on:
  workflow_dispatch:
  push:
    branches: [test/remote-engine-tests]

permissions:
  contents: read
  checks: write

jobs:
  remote-engine-tests:
    name: Remote engine tests (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - v2023.7
          - v2025.0
          - v2025.1
          - v2025.2
          - v2025.3
          - v2025.4
          - v2025.5
          - v2025.6
          - v2025.7
          - v2025.8
          - v2025.9

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build scoreboard Docker image
        run: ./scripts/build-scoreboard-images.sh --versions "${{ matrix.version }}"

      - name: Run remote engine tests
        run: ./scripts/test-remote-engine-scoreboards.sh --versions "${{ matrix.version }}"

      - name: Upload test result JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-engine-test-results-${{ matrix.version }}
          path: test-results/*.json
          if-no-files-found: warn

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Remote engine tests (${{ matrix.version }})
          path: 'test-results/*.json'
          reporter: flutter-json
