name: Remote engine tests

# Runs remote_engine_test/ (lib/services/remote_game_engine.dart exercised
# directly against a dockerized CRG scoreboard server, no app UI/emulator
# involved) and publishes the results as a GitHub Check via dorny/test-reporter.
#
# Manual-only via workflow_dispatch, run from the Actions tab, optionally
# against a different set of scoreboard versions than the default (latest
# only).
#
# TEMPORARY: `push` is enabled below only so this workflow can be exercised
# on this branch before it's merged - workflow_dispatch can't target a
# workflow that doesn't exist on the default branch yet. Remove the `push`
# trigger before merging to main.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated scoreboard versions to test (see scripts/test-remote-engine-scoreboards.sh)'
        required: false
        default: v2025.9
  push:
    branches: [test/remote-engine-tests]

permissions:
  contents: read
  checks: write

jobs:
  remote-engine-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build scoreboard Docker image(s)
        run: ./scripts/build-scoreboard-images.sh --versions "${{ inputs.versions || 'v2025.9' }}"

      - name: Run remote engine tests
        run: ./scripts/test-remote-engine-scoreboards.sh --versions "${{ inputs.versions || 'v2025.9' }}"

      - name: Upload test result JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-engine-test-results
          path: test-results/*.json
          if-no-files-found: warn

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Remote engine test results
          path: 'test-results/*.json'
          reporter: flutter-json
